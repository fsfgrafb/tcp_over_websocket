[package]
name = "tcp_over_websocket"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
description = "TCP over WebSocket tunneling through SZUT WebVPN"
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/tcp_over_websocket"
keywords = ["tcp", "websocket", "tunnel", "webvpn"]
categories = ["network-programming"]

[features]
default = ["client", "server"]
client = [
	"dep:aes",
	"dep:image",
	"dep:reqwest",
	"dep:rustls",
	"dep:serde",
	"tokio-tungstenite/connect",
	"tokio-tungstenite/rustls-tls-webpki-roots",
]
server = []

[dependencies]
aes = { version = "0.8", optional = true }
anyhow = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
	"cookies",
	"json",
	"rustls-tls",
], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg"], optional = true }
tokio = { version = "1", features = [
	"io-util",
	"macros",
	"net",
	"rt-multi-thread",
	"signal",
	"sync",
	"time",
] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }

[[bin]]
name = "towc"
path = "src/bin/towc.rs"
required-features = ["client"]

[[bin]]
name = "tows"
path = "src/bin/tows.rs"
required-features = ["server"]

[[bin]]
name = "cookie_keepalive_test"
path = "src/bin/cookie_keepalive_test.rs"
required-features = ["client"]
