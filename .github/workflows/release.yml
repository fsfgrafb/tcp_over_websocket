name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Test
        run: cargo test --all-features
      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc --all-features --bin towc --bin tows --bin towc_gui
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/tcp_over_websocket-v0.5.1-windows-x64
          Copy-Item target/x86_64-pc-windows-msvc/release/towc.exe,target/x86_64-pc-windows-msvc/release/tows.exe,target/x86_64-pc-windows-msvc/release/towc_gui.exe -Destination dist/tcp_over_websocket-v0.5.1-windows-x64
          Copy-Item README.md,LICENSE -Destination dist/tcp_over_websocket-v0.5.1-windows-x64
          New-Item -ItemType Directory -Path dist/tcp_over_websocket-v0.5.1-windows-x64/docs
          Copy-Item docs/protocol-v2.md -Destination dist/tcp_over_websocket-v0.5.1-windows-x64/docs
          Compress-Archive -Path dist/tcp_over_websocket-v0.5.1-windows-x64 -DestinationPath dist/tcp_over_websocket-v0.5.1-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.zip

  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu --no-default-features --features client,server --bin towc --bin tows
      - name: Package
        run: |
          mkdir -p dist/tcp_over_websocket-v0.5.1-linux-x64/docs
          cp target/x86_64-unknown-linux-gnu/release/towc target/x86_64-unknown-linux-gnu/release/tows README.md LICENSE dist/tcp_over_websocket-v0.5.1-linux-x64/
          cp docs/protocol-v2.md dist/tcp_over_websocket-v0.5.1-linux-x64/docs/
          cd dist && zip -r tcp_over_websocket-v0.5.1-linux-x64.zip tcp_over_websocket-v0.5.1-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/*.zip

  linux-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cross
        run: cargo install cross --locked
      - name: Build
        run: cross build --release --target aarch64-unknown-linux-gnu --no-default-features --features client,server --bin towc --bin tows
      - name: Package
        run: |
          mkdir -p dist/tcp_over_websocket-v0.5.1-linux-aarch64/docs
          cp target/aarch64-unknown-linux-gnu/release/towc target/aarch64-unknown-linux-gnu/release/tows README.md LICENSE dist/tcp_over_websocket-v0.5.1-linux-aarch64/
          cp docs/protocol-v2.md dist/tcp_over_websocket-v0.5.1-linux-aarch64/docs/
          cd dist && zip -r tcp_over_websocket-v0.5.1-linux-aarch64.zip tcp_over_websocket-v0.5.1-linux-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: dist/*.zip

  publish:
    needs: [windows, linux-x64, linux-aarch64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
